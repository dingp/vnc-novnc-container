name: Build VNC/noVNC image

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
    paths:
      - Dockerfile
      - container/**
      - vnc_novnc/**
      - scripts/**
      - pyproject.toml
      - .github/workflows/build-image.yaml

  pull_request:
    paths:
      - Dockerfile
      - container/**
      - vnc_novnc/**
      - scripts/**
      - pyproject.toml
      - .github/workflows/build-image.yaml

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CACHE_SCOPE: debian-12
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build_and_push_image:
    name: Build and push image
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,prefix=debian-12-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: vnc-novnc-container:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Smoke test image
        run: |
          docker run --rm --entrypoint /bin/sh vnc-novnc-container:ci -lc '
            python3 -c "import vnc_novnc"
            test -x /usr/local/bin/vnc-novnc-entrypoint
            test -x /usr/local/bin/vnc-novnc-jupyter-kernel
            test -x /usr/local/bin/sshproxy
          '

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
